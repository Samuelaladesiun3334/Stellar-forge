[package]
name = "stellar-forge-controller"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Kubernetes operator controller for Stellar-forge with k8s-lease leader election"

[[bin]]
name = "controller"
path = "src/main.rs"

[dependencies]
# Kubernetes client & runtime
kube = { version = "0.91", features = ["runtime", "derive", "client", "ws"] }
k8s-openapi = { version = "0.22", features = ["v1_29"] }

# Async runtime
tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["time"] }

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Randomness (jitter for lease renewal)
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
